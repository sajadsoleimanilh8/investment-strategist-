# The production stack. Standalone: it does not extend docker-compose.yml, whose
# defaults are for a demo (a known JWT secret, a known database password, seeded
# data, ports on every interface).
#
#     cp .env.production.example .env.production     # then fill every value in
#     docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Every secret is `${VAR:?message}`, so a missing one stops `up` with a
# sentence instead of starting a stack on an empty password.
#
# Only Caddy publishes anything (80 and 443). Postgres, Redis, the API and the
# web container are reachable on the internal network and nowhere else, and
# Caddy obtains and renews the certificates itself.
#
# Needs two DNS names pointing at this host: APP_DOMAIN for the web app and
# API_DOMAIN for the API. Two origins rather than one path-routed origin
# because the web image bakes the API address in at build time and its CSP
# names the API host explicitly; see web/Dockerfile.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finmentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: finmentor
    volumes: ["finmentor_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmentor -d finmentor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # A password, because the limiter's counters and the scheduler's leases live
    # here and an unauthenticated Redis that ever becomes reachable is an open one.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://finmentor:${POSTGRES_PASSWORD}@db:5432/finmentor
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DEMO_MODE: "false"
      ENV: prod
      SEED_DEMO_DATA: "false"
      ENABLE_SCHEDULER: "true"
      LOG_FORMAT: json
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
      CORS_ORIGINS: '["https://${APP_DOMAIN:?set APP_DOMAIN}"]'
      WEB_BASE_URL: https://${APP_DOMAIN}
      OAUTH_REDIRECT_BASE: https://${API_DOMAIN:?set API_DOMAIN}
      MAIL_TRANSPORT: smtp
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MARKET_LIVE_SOURCE: live
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  # The Telegram bot. It was never in the compose file, so it only ever ran from
  # somebody's shell and stopped when their laptop slept.
  #
  # Same image, so the same migrations are already applied by the time it
  # starts (it waits for a healthy API). Its own healthcheck is disabled: the
  # image's one curls port 8000, which a long-polling bot does not serve, and
  # would mark a working bot unhealthy forever.
  bot:
    build: { context: ., dockerfile: Dockerfile }
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *app_env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env.production}
      ENABLE_SCHEDULER: "false"
    healthcheck: { disable: true }
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}
    environment:
      CSP_CONNECT_SRC: "'self' https://${API_DOMAIN} wss://${API_DOMAIN}"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [api, web]
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  finmentor_pg:
  caddy_data:
  caddy_config:
