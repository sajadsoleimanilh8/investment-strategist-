# The web image's nginx config.
#
# Processed as a template at container start: the official nginx image runs
# `envsubst` over /etc/nginx/templates/*.template, and NGINX_ENVSUBST_FILTER
# in the Dockerfile restricts it to `CSP_` names so nginx's own `$uri` and
# `$host` survive untouched. The only substituted value is the connect-src
# list, because that is the one part of the policy that genuinely differs per
# deployment.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A request body this app never sends. The largest thing a browser posts
    # here is a financial profile, which is a few hundred bytes; the API
    # enforces its own 64 KiB ceiling (app/main.py) and this is the same limit
    # one layer out, for deployments where nginx fronts the API too.
    client_max_body_size 64k;

    # Every route is client-side. A reload on /simulate must return index.html
    # rather than 404 — without this, the app works until someone refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so these can be cached hard. index.html must not be —
    # it is what points at the current hashes, and a stale one pins a browser
    # to a deployment that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Content-Security-Policy ------------------------------------------
    #
    # The app stores a 14-day refresh token in localStorage. That is the right
    # trade for the short-lived access token it buys back (see
    # web/src/api/client.ts), and it is a trade that only holds if a script
    # cannot be injected in the first place. This is the control that makes it
    # hold, and the bundle is unusually well suited to a strict one: it loads
    # no third-party script, no web font and no remote image, which
    # `contrast.test.ts` already enforces at build time.
    #
    # Each directive, and what in this app needs it:
    #
    #   default-src 'self'   the floor. Everything below is a narrowing of it.
    #   script-src 'self'    the built bundle is one external module script;
    #                        dist/index.html carries no inline script and the
    #                        bundle contains no eval or new Function.
    #   style-src 'self'     one external stylesheet. No 'unsafe-inline':
    #                        nothing builds a <style> element or touches
    #                        cssText, and React applies `style={{...}}`
    #                        through the CSSOM, which CSP does not govern.
    #   img-src 'self' data: the grain plate in cinema.css is an inline
    #                        SVG turbulence filter as a data: URI. CSS
    #                        background images fall under img-src.
    #   font-src 'self'      system stacks only, by design. Declared so that
    #                        adding a web font fails loudly here as well as
    #                        in contrast.test.ts.
    #   connect-src          the API origin and the live-price WebSocket.
    #                        Substituted at start-up: this is the only part
    #                        that differs per deployment.
    #   frame-ancestors      this app is never framed. Does what the
    #                        X-Frame-Options below does, for browsers that
    #                        prefer the modern spelling.
    #   base-uri 'none'      a <base> tag rewrites every relative URL on the
    #                        page, including the script src. Nothing here
    #                        needs one.
    #   form-action 'self'   there is no cross-origin form post in this app;
    #                        sign-in leaves by redirect, which this does not
    #                        touch.
    #   object-src 'none'    no plugins, ever.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src ${CSP_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # No camera, microphone or location anywhere in this product.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # HSTS is deliberately NOT set here. This server listens on plain :80
    # behind whatever terminates TLS, and a max-age sent over http is ignored
    # by browsers anyway. Worse, setting it here and getting it wrong pins
    # every visitor to https for a year against a deployment that may not
    # have a certificate yet. It belongs at the TLS terminator, and
    # docs/PRE_DEPLOY.md is where that is checked:
    #
    #   Strict-Transport-Security: max-age=31536000; includeSubDomains
    #
    # Add `preload` only once the value has been served unchanged for a while
    # and every subdomain is genuinely https, because that one is not
    # reversible on any useful timescale.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
