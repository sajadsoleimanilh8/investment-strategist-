server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Every route is client-side. A reload on /simulate must return index.html
    # rather than 404 — without this, the app works until someone refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so these can be cached hard. index.html must not be —
    # it is what points at the current hashes, and a stale one pins a browser
    # to a deployment that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app is a single-origin static bundle: it loads no third-party script,
    # no web font, no remote image. `connect-src` stays permissive because the
    # API origin is a build-time argument and differs per deployment.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
